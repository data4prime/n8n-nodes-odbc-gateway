name: Publish to npm

# Pubblica il pacchetto su npm quando viene creato un tag vX.Y.Z.
# Usa il Trusted Publishing (OIDC): nessun token: npm si fida di questo
# workflow tramite l'autorizzazione configurata su npmjs.com
# (pacchetto -> Settings -> Trusted Publisher). La provenance e' automatica.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # richiesto dall'OIDC/Trusted Publishing (+ provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Il Trusted Publishing richiede npm >= 11.5.1 (Node 20 ne porta una piu' vecchia).
      - name: Upgrade npm
        run: npm install -g npm@latest

      # --ignore-scripts evita la compilazione nativa di isolated-vm
      # (dipendenza di n8n-workflow, serve solo per i tipi in fase di build).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != package.json ${PKG_VERSION}"
            exit 1
          fi

      # Nessun NODE_AUTH_TOKEN: l'autenticazione avviene via OIDC.
      - name: Publish
        run: npm publish --access public --provenance
