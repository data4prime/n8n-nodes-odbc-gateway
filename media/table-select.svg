<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="1" y="1" width="978" height="698" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- header bar -->
  <path d="M1 17 A16 16 0 0 1 17 1 H963 A16 16 0 0 1 979 17 V64 H1 Z" fill="#f8fafc"/>
  <line x1="1" y1="64" x2="979" y2="64" stroke="#e2e8f0" stroke-width="2"/>
  <g transform="translate(20,14) scale(0.36)">
    <rect x="2" y="2" width="96" height="96" rx="24" fill="#1e293b"/>
    <path d="M24 78 L24 48 A26 26 0 0 1 76 48 L76 78 L64 78 L64 49 A14 14 0 0 0 36 49 L36 78 Z" fill="#ffffff"/>
    <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 61 H56"/><path d="M49 55 L61 61 L49 67"/></g>
  </g>
  <text x="68" y="40" font-size="19" font-weight="700" fill="#0f172a">ODBC/JDBC Gateway</text>
  <rect x="800" y="15" width="158" height="34" rx="8" fill="#2563eb"/>
  <text x="879" y="37" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">&#9654;  Test step</text>

  <!-- vertical divider form | output -->
  <line x1="556" y1="64" x2="556" y2="699" stroke="#e2e8f0" stroke-width="2"/>

  <!-- form fields -->
  <g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <g>
      <text x="28" y="100" font-size="13" font-weight="600" fill="#334155">Operation</text>
      <rect x="28" y="110" width="500" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="42" y="134" font-size="15" fill="#0f172a">Table &#183; Select</text>
      <text x="512" y="134" font-size="12" fill="#94a3b8">&#9662;</text>
    </g>
    <g>
      <text x="28" y="172" font-size="13" font-weight="600" fill="#334155">Connection</text>
      <circle cx="122" cy="168" r="7.5" fill="none" stroke="#cbd5e1"/><text x="122" y="172" text-anchor="middle" font-size="10" fill="#94a3b8">?</text>
      <rect x="28" y="182" width="240" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="42" y="206" font-size="15" fill="#0f172a">pg_test</text><text x="252" y="206" font-size="12" fill="#94a3b8">&#9662;</text>
      <text x="288" y="172" font-size="13" font-weight="600" fill="#334155">Schema &#183; Table</text>
      <rect x="288" y="182" width="240" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="302" y="206" font-size="15" fill="#0f172a">public &#183; orders</text><text x="512" y="206" font-size="12" fill="#94a3b8">&#9662;</text>
    </g>
    <g>
      <text x="28" y="244" font-size="13" font-weight="600" fill="#334155">Output Columns</text>
      <rect x="28" y="254" width="500" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="40" y="262" width="88" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/><text x="84" y="277" text-anchor="middle" font-size="13" fill="#1e40af">customer</text>
    </g>
    <g>
      <text x="28" y="316" font-size="13" font-weight="600" fill="#334155">Aggregations</text>
      <rect x="28" y="326" width="500" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <!-- row 1 -->
      <rect x="40" y="336" width="150" height="24" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/><text x="52" y="352" font-size="13" fill="#0f172a">Count &#183; all rows</text>
      <text x="200" y="352" font-size="13" fill="#64748b">as</text>
      <rect x="224" y="336" width="90" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/><text x="269" y="352" text-anchor="middle" font-size="13" fill="#047857">orders</text>
      <!-- row 2 -->
      <rect x="40" y="366" width="150" height="24" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/><text x="52" y="382" font-size="13" fill="#0f172a">Sum &#183; amount</text>
      <text x="200" y="382" font-size="13" fill="#64748b">as</text>
      <rect x="224" y="366" width="90" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/><text x="269" y="382" text-anchor="middle" font-size="13" fill="#047857">revenue</text>
    </g>
    <g>
      <text x="28" y="424" font-size="13" font-weight="600" fill="#334155">Group By</text>
      <rect x="28" y="434" width="500" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="40" y="442" width="88" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/><text x="84" y="457" text-anchor="middle" font-size="13" fill="#1e40af">customer</text>
    </g>
    <g>
      <text x="28" y="496" font-size="13" font-weight="600" fill="#334155">Sort &#8212; by aggregation alias</text>
      <rect x="28" y="506" width="170" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="42" y="530" font-size="15" fill="#0f172a">orders</text><text x="182" y="530" font-size="12" fill="#94a3b8">&#9662;</text>
      <rect x="206" y="506" width="120" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="220" y="530" font-size="15" fill="#0f172a">DESC</text><text x="310" y="530" font-size="12" fill="#94a3b8">&#9662;</text>
      <text x="360" y="496" font-size="13" font-weight="600" fill="#334155">Limit</text>
      <rect x="360" y="506" width="168" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="374" y="530" font-size="15" fill="#0f172a">50</text>
    </g>
    <!-- generated SQL hint -->
    <rect x="28" y="566" width="500" height="110" rx="8" fill="#0f172a"/>
    <text x="44" y="588" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">GENERATED SQL &#183; INJECTION-SAFE</text>
    <text x="44" y="610" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#93c5fd">SELECT "customer", <tspan fill="#e2e8f0">COUNT(*) AS "orders",</tspan></text>
    <text x="60" y="628" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#e2e8f0">SUM("amount") AS "revenue"</text>
    <text x="44" y="646" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#93c5fd">FROM "public"."orders"</text>
    <text x="44" y="664" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#93c5fd">GROUP BY "customer" ORDER BY "orders" DESC</text>
  </g>

  <!-- output panel -->
  <text x="580" y="100" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">OUTPUT</text>
  <rect x="648" y="86" width="86" height="22" rx="11" fill="#dcfce7"/><text x="691" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">3 groups</text>

  <g font-size="14">
    <rect x="580" y="124" width="372" height="40" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="600" y="149" font-weight="700" fill="#334155">customer</text>
    <text x="760" y="149" font-weight="700" fill="#334155">orders</text>
    <text x="870" y="149" font-weight="700" fill="#334155">revenue</text>

    <rect x="580" y="164" width="372" height="38" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="600" y="188" fill="#0f172a">acme</text><text x="760" y="188" fill="#0f172a">12</text><text x="870" y="188" fill="#0f172a">1,240.00</text>
    <rect x="580" y="202" width="372" height="38" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="600" y="226" fill="#0f172a">globex</text><text x="760" y="226" fill="#0f172a">8</text><text x="870" y="226" fill="#0f172a">760.00</text>
    <rect x="580" y="240" width="372" height="38" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="600" y="264" fill="#0f172a">initech</text><text x="760" y="264" fill="#0f172a">5</text><text x="870" y="264" fill="#0f172a">410.00</text>
  </g>
  <text x="580" y="312" font-size="13" fill="#64748b">One item per group &#8212; aggregated with GROUP BY,</text>
  <text x="580" y="332" font-size="13" fill="#64748b">ordered by the "orders" alias.</text>
</svg>
